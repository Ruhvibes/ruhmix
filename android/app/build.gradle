// RuhMix app module.
// Public version is ALWAYS "1.0" (versionCode is internal only — Android
// needs it to increment for update-installs).
apply plugin: 'com.android.application'

android {
    namespace 'com.ruhmix.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ruhmix.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.0'
    }

    signingConfigs {
        ruhvibes {
            storeFile file("$rootDir/../keystore/ruhvibes.jks")
            storePassword project.findProperty('ruhvibesStorePassword')
            keyAlias 'ruhvibes'
            keyPassword project.findProperty('ruhvibesKeyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Persistent Ruhvibes keystore on BOTH build types (Gradle's
            // auto-generated debug key changes on every VM wipe and breaks
            // update-installs). Passwords live in ~/.gradle/gradle.properties
            // (copied to /root/.gradle/gradle.properties since Gradle runs as root).
            signingConfig signingConfigs.ruhvibes
        }
        debug {
            signingConfig signingConfigs.ruhvibes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    // Explicit (already cached transitively): FileProvider for the share sheet.
    implementation 'androidx.core:core:1.13.0'
    // AdMob: rewarded video (AI Stem Separation gate) + interstitial (post-export).
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    // Force modern Fragment (lint InvalidFragmentVersionForActivityResult fix).
    implementation 'androidx.fragment:fragment:1.8.0'
}

// kotlin-stdlib:1.8.22 (pulled in by androidx) already contains the
// kotlin-stdlib-jdk7/jdk8 classes; drop the stale duplicates to avoid
// "Duplicate class" build errors.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}
